name: Build Deathpool AI Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Auto Generate Complete Project
      run: |
        # 1. gradle.properties
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        # 2. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "DeathpoolAI"
        include ':app'
        EOF

        # 3. root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 4. Folder structure & resources
        mkdir -p app/src/main/java/com/deathpool/ai
        mkdir -p app/src/main/res/values

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Deathpool AI</string>
        </resources>
        EOF

        # 5. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.deathpool.ai'
            compileSdk 34

            defaultConfig {
                applicationId "com.deathpool.ai"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }

            buildFeatures {
                compose true
            }
            composeOptions {
                kotlinCompilerExtensionVersion '1.5.8'
            }
            packaging {
                resources {
                    excludes += "/META-INF/{AL2.0,LGPL2.1}"
                }
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'io.coil-kt:coil-compose:2.5.0'
        }
        EOF

        # 6. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 7. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/deathpool/ai/MainActivity.kt
        package com.deathpool.ai

        import android.content.Context
        import android.content.Intent
        import android.os.Bundle
        import android.speech.tts.TextToSpeech
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.background
        import androidx.compose.foundation.border
        import androidx.compose.foundation.horizontalScroll
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.lazy.items
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.layout.ContentScale
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.lifecycle.lifecycleScope
        import coil.compose.AsyncImage
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch
        import kotlinx.coroutines.withContext
        import okhttp3.MediaType.Companion.toMediaType
        import okhttp3.OkHttpClient
        import okhttp3.Request
        import okhttp3.RequestBody.Companion.toRequestBody
        import org.json.JSONArray
        import org.json.JSONObject
        import java.io.File
        import java.net.URLEncoder
        import java.util.Locale
        import java.util.concurrent.TimeUnit

        data class ChatMessage(
            val text: String,
            val isUser: Boolean,
            val imageUrl: String? = null
        )

        class MainActivity : ComponentActivity(), TextToSpeech.OnInitListener {
            private var tts: TextToSpeech? = null
            private val httpClient = OkHttpClient.Builder()
                .connectTimeout(25, TimeUnit.SECONDS)
                .readTimeout(25, TimeUnit.SECONDS)
                .build()

            private val memoryFile by lazy { File(filesDir, "deathpool_memory.json") }

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                tts = TextToSpeech(this, this)
                val prefs = getSharedPreferences("deathpool_prefs", Context.MODE_PRIVATE)

                setContent {
                    val messages = remember { mutableStateListOf<ChatMessage>() }
                    var inputText by remember { mutableStateOf("") }
                    var apiKey by remember { mutableStateOf(prefs.getString("api_key", "") ?: "") }
                    var showSettingsDialog by remember { mutableStateOf(false) }
                    var showPhotoDialog by remember { mutableStateOf(false) }
                    var isThinking by remember { mutableStateOf(false) }

                    val deadpoolRed = Color(0xFFE50914)
                    val darkBg = Color(0xFF0F0F12)
                    val cardDark = Color(0xFF1B1B22)
                    val userBubble = Color(0xFF282833)

                    // Load memory from local file
                    LaunchedEffect(Unit) {
                        if (memoryFile.exists()) {
                            try {
                                val jsonStr = memoryFile.readText()
                                val arr = JSONArray(jsonStr)
                                for (i in 0 until arr.length()) {
                                    val obj = arr.getJSONObject(i)
                                    val img = if (obj.has("imageUrl")) obj.getString("imageUrl") else null
                                    messages.add(ChatMessage(obj.getString("text"), obj.getBoolean("isUser"), img))
                                }
                            } catch (_: Exception) {}
                        }
                        if (messages.isEmpty()) {
                            messages.add(ChatMessage("Kya bolti public! Main hu Deathpool AI. Tera personal, fearless aur obedient partner. Jo hukum karega wahi hoga!", false))
                        }
                    }

                    fun saveToLocalFile() {
                        lifecycleScope.launch(Dispatchers.IO) {
                            try {
                                val arr = JSONArray()
                                messages.takeLast(40).forEach { msg ->
                                    val obj = JSONObject()
                                    obj.put("text", msg.text)
                                    obj.put("isUser", msg.isUser)
                                    if (msg.imageUrl != null) obj.put("imageUrl", msg.imageUrl)
                                    arr.put(obj)
                                }
                                memoryFile.writeText(arr.toString())
                            } catch (_: Exception) {}
                        }
                    }

                    fun generateAIPhoto(prompt: String) {
                        val encoded = URLEncoder.encode(prompt, "UTF-8")
                        val photoUrl = "https://image.pollinations.ai/prompt/$encoded?width=800&height=800&nologo=true"
                        val msg = ChatMessage("Aapki photo ready hai: \"$prompt\"", false, imageUrl = photoUrl)
                        messages.add(msg)
                        saveToLocalFile()
                        speak("Aapki image generate ho gayi hai boss!")
                    }

                    fun triggerShorts() {
                        val p = "Mere YouTube channel ke liye 5 funny viral shorts scripts de with hook, visuals aur Hindi comedy dialogues. To-the-point format me."
                        messages.add(ChatMessage(p, true))
                        isThinking = true
                        lifecycleScope.launch(Dispatchers.IO) {
                            val res = askGemini(apiKey, p, messages)
                            withContext(Dispatchers.Main) {
                                isThinking = false
                                messages.add(ChatMessage(res, false))
                                saveToLocalFile()
                                speak(res)
                            }
                        }
                    }

                    fun triggerAirdrops() {
                        val p = "Mujhe current active free Web3 and Telegram airdrops ki verified list do jisme zero paisa laga kar claim kar sakein. Points me batao."
                        messages.add(ChatMessage(p, true))
                        isThinking = true
                        lifecycleScope.launch(Dispatchers.IO) {
                            val res = askGemini(apiKey, p, messages)
                            withContext(Dispatchers.Main) {
                                isThinking = false
                                messages.add(ChatMessage(res, false))
                                saveToLocalFile()
                                speak(res)
                            }
                        }
                    }

                    // Settings Dialog
                    if (showSettingsDialog) {
                        var tempKey by remember { mutableStateOf(apiKey) }
                        AlertDialog(
                            onDismissRequest = { showSettingsDialog = false },
                            containerColor = cardDark,
                            title = { Text("⚡ Deadpool AI Settings", color = Color.White, fontWeight = FontWeight.Bold) },
                            text = {
                                Column {
                                    Text("Gemini API Key paste karein:", color = Color.Gray, fontSize = 13.sp)
                                    Spacer(modifier = Modifier.height(8.dp))
                                    TextField(
                                        value = tempKey,
                                        onValueChange = { tempKey = it },
                                        placeholder = { Text("AIzaSy...", color = Color.DarkGray) },
                                        colors = OutlinedTextFieldDefaults.colors(
                                            focusedTextColor = Color.White,
                                            unfocusedTextColor = Color.White
                                        )
                                    )
                                    Spacer(modifier = Modifier.height(14.dp))
                                    Button(
                                        onClick = {
                                            messages.clear()
                                            memoryFile.delete()
                                            messages.add(ChatMessage("Memory saaf kar di boss! Nayi shuruaat karte hain.", false))
                                        },
                                        colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF333333))
                                    ) {
                                        Text("🧹 Clear Chat Memory", fontSize = 12.sp, color = Color.LightGray)
                                    }
                                }
                            },
                            confirmButton = {
                                Button(
                                    onClick = {
                                        apiKey = tempKey.trim()
                                        prefs.edit().putString("api_key", apiKey).apply()
                                        showSettingsDialog = false
                                        val confirm = "API Key save ho gayi! Deadpool full throttle mode me active hai."
                                        messages.add(ChatMessage(confirm, false))
                                        saveToLocalFile()
                                        speak(confirm)
                                    },
                                    colors = ButtonDefaults.buttonColors(containerColor = deadpoolRed)
                                ) { Text("Save") }
                            },
                            dismissButton = {
                                TextButton(onClick = { showSettingsDialog = false }) { Text("Cancel", color = Color.Gray) }
                            }
                        )
                    }

                    // Photo Prompt Dialog
                    if (showPhotoDialog) {
                        var photoPrompt by remember { mutableStateOf("") }
                        AlertDialog(
                            onDismissRequest = { showPhotoDialog = false },
                            containerColor = cardDark,
                            title = { Text("🎨 Instant AI Photo", color = Color.White, fontWeight = FontWeight.Bold) },
                            text = {
                                Column {
                                    Text("Kaisi photo banani hai? Likhiye:", color = Color.Gray, fontSize = 13.sp)
                                    Spacer(modifier = Modifier.height(8.dp))
                                    TextField(
                                        value = photoPrompt,
                                        onValueChange = { photoPrompt = it },
                                        placeholder = { Text("e.g. Deadpool riding a motorcycle in cyberpunk city", color = Color.DarkGray) },
                                        colors = OutlinedTextFieldDefaults.colors(
                                            focusedTextColor = Color.White,
                                            unfocusedTextColor = Color.White
                                        )
                                    )
                                }
                            },
                            confirmButton = {
                                Button(
                                    onClick = {
                                        if (photoPrompt.isNotBlank()) {
                                            showPhotoDialog = false
                                            generateAIPhoto(photoPrompt.trim())
                                        }
                                    },
                                    colors = ButtonDefaults.buttonColors(containerColor = deadpoolRed)
                                ) { Text("Generate") }
                            },
                            dismissButton = {
                                TextButton(onClick = { showPhotoDialog = false }) { Text("Cancel", color = Color.Gray) }
                            }
                        )
                    }

                    Column(
                        modifier = Modifier
                            .fillMaxSize()
                            .background(darkBg)
                            .padding(14.dp)
                    ) {
                        // Header Bar
                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .clip(RoundedCornerShape(16.dp))
                                .background(cardDark)
                                .padding(horizontal = 16.dp, vertical = 12.dp),
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.SpaceBetween
                        ) {
                            Row(verticalAlignment = Alignment.CenterVertically) {
                                Box(
                                    modifier = Modifier
                                        .size(36.dp)
                                        .clip(CircleShape)
                                        .background(deadpoolRed),
                                    contentAlignment = Alignment.Center
                                ) { Text("💀", fontSize = 18.sp) }
                                Spacer(modifier = Modifier.width(10.dp))
                                Column {
                                    Text("DEATHPOOL PRO", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                    Text(if (apiKey.isNotBlank()) "Brain Active • Auto-Save" else "Click ⚙️ to Connect Key", color = if (apiKey.isNotBlank()) Color(0xFF00E676) else deadpoolRed, fontSize = 11.sp)
                                }
                            }
                            IconButton(onClick = { showSettingsDialog = true }) {
                                Text("⚙️", fontSize = 20.sp)
                            }
                        }

                        Spacer(modifier = Modifier.height(10.dp))

                        // Quick Buttons Ribbon
                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .horizontalScroll(rememberScrollState()),
                            horizontalArrangement = Arrangement.spacedBy(8.dp)
